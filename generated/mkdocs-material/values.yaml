configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8111
persistence:
  vol-data:
    mountPath: /docs
    size: 10Gi
secrets: {}
services:
  mkdocs-material:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: squidfunk/mkdocs-material
      tag: 9.7.7
    port: 8000
    volumeMounts:
    - mountPath: /docs
      name: vol-data
