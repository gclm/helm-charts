configMaps: {}
env: {}
persistence:
  vol-data-data:
    mountPath: /data
    size: 10Gi
  vol-data-music:
    mountPath: /music
    size: 10Gi
secrets: {}
services:
  navidrome:
    env:
    - name: ND_SCANSCHEDULE
      value: 1h
    - name: ND_LOGLEVEL
      value: info
    - name: ND_SESSIONTIMEOUT
      value: 24h
    - name: ND_BASEURL
      value: ''
    image:
      registry: ''
      repository: deluan/navidrome
      tag: 0.64.2
    port: 4533
    volumeMounts:
    - mountPath: /data
      name: vol-data-data
    - mountPath: /music
      name: vol-data-music
