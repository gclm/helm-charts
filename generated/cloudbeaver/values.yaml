configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8978
persistence:
  vol-data:
    mountPath: /opt/cloudbeaver/workspace
    size: 10Gi
secrets: {}
services:
  cloudbeaver:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: dbeaver/cloudbeaver
      tag: 26.2.3
    port: 8978
    volumeMounts:
    - mountPath: /opt/cloudbeaver/workspace
      name: vol-data
