configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40049
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /config
    size: 10Gi
secrets: {}
services:
  heimdall:
    env:
    - name: PUID
      value: '1000'
    - name: PGID
      value: '1000'
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: linuxserver/heimdall
      tag: 2.8.4
    port: 80
    volumeMounts:
    - mountPath: /config
      name: vol-data
