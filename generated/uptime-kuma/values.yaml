configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3001
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  uptime-kuma:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: louislam/uptime-kuma
      tag: 2.5.6
    port: 3001
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
