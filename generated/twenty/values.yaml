configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
  TWENTY_APP_SECRET: ''
  TWENTY_SERVER_URL: http://<YOUR IP>:3000
persistence:
  vol-data:
    mountPath: /app/packages/twenty-server/.local-storage
    size: 10Gi
secrets: {}
services:
  server:
    env:
    - name: NODE_PORT
      value: '3000'
    - name: SERVER_URL
      valueFromEnv: TWENTY_SERVER_URL
    - name: STORAGE_TYPE
      value: local
    - name: APP_SECRET
      valueFromEnv: TWENTY_APP_SECRET
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: twentycrm/twenty
      tag: v2.53.1
    port: 3000
    probe:
      exec: curl --fail http://localhost:3000/healthz
      intervalSeconds: 5
      retries: 20
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /app/packages/twenty-server/.local-storage
      name: vol-data
  worker:
    command:
    - yarn
    - worker:prod
    env:
    - name: SERVER_URL
      valueFromEnv: TWENTY_SERVER_URL
    - name: STORAGE_TYPE
      value: local
    - name: APP_SECRET
      valueFromEnv: TWENTY_APP_SECRET
    image:
      registry: ''
      repository: twentycrm/twenty
      tag: v2.53.1
    volumeMounts:
    - mountPath: /app/packages/twenty-server/.local-storage
      name: vol-data
