configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 5000
persistence:
  vol-data:
    mountPath: /var/lib/registry
    size: 10Gi
secrets: {}
services:
  docker-registry:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: registry
      tag: 3.1.2
    port: 5000
    volumeMounts:
    - mountPath: /var/lib/registry
      name: vol-data
