configMaps: {}
env:
  ACCESS_AUTH_CODE: ''
  PANEL_APP_PORT_HTTP: 6806
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /siyuan/workspace
    size: 10Gi
secrets: {}
services:
  siyuan:
    command:
    - serve
    - --workspace=/siyuan/workspace/
    - --accessAuthCode=${ACCESS_AUTH_CODE}
    env:
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: PUID
      value: '1000'
    - name: PGID
      value: '1000'
    - name: ACCESS_AUTH_CODE
      valueFromEnv: ACCESS_AUTH_CODE
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: b3log/siyuan
      tag: v3.8.9
    port: 6806
    volumeMounts:
    - mountPath: /siyuan/workspace
      name: vol-data
