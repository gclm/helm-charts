configMaps: {}
env:
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /config
    size: 10Gi
secrets: {}
services:
  freshrss:
    env:
    - name: PUID
      value: '1000'
    - name: PGID
      value: '1000'
    - name: TZ
      valueFromEnv: TIME_ZONE
    image:
      registry: ''
      repository: linuxserver/freshrss
      tag: 1.30.1
    port: 80
    volumeMounts:
    - mountPath: /config
      name: vol-data
