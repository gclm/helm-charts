configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /app/data/storage
    size: 10Gi
secrets: {}
services:
  docmost:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: docmost/docmost
      tag: 0.97.0
    port: 3000
    volumeMounts:
    - mountPath: /app/data/storage
      name: vol-data
