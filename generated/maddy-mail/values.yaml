configMaps: {}
env:
  MAIL_DOMAIN: example.com
  MAIL_HOSTNAME: mail.example.com
  SMTP_IN_PORT: 25
persistence: {}
secrets: {}
services:
  maddymail:
    env:
    - name: MADDY_HOSTNAME
      valueFromEnv: MAIL_HOSTNAME
    - name: MADDY_DOMAIN
      valueFromEnv: MAIL_DOMAIN
    - name: SMTP_IN_PORT
      valueFromEnv: SMTP_IN_PORT
    image:
      registry: ''
      repository: foxcpp/maddy
      tag: 0.9.6
    port: 25
    volumeMounts: []
