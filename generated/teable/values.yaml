configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
  PUBLIC_ORIGIN: http://<YOUR IP>:3000
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /app/.assets
    size: 10Gi
secrets: {}
services:
  teable:
    env:
    - name: PUBLIC_ORIGIN
      valueFromEnv: PUBLIC_ORIGIN
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: NEXT_ENV_IMAGES_ALL_REMOTE
      value: 'true'
    - name: BACKEND_CACHE_PROVIDER
      value: redis
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      digest: sha256:38065210e53e3e2390ff591e44e20ab09546b17a75df8c325d8bcbe9fb089f55
      registry: ghcr.io
      repository: teableio/teable
      tag: null
    port: 3000
    volumeMounts:
    - mountPath: /app/.assets
      name: vol-data
