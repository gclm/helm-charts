configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
  PUBLIC_ORIGIN: http://<YOUR IP>:3000
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /app/.assets
    size: 10Gi
secrets: {}
services:
  teable:
    env:
    - name: PUBLIC_ORIGIN
      valueFromEnv: PUBLIC_ORIGIN
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: NEXT_ENV_IMAGES_ALL_REMOTE
      value: 'true'
    - name: BACKEND_CACHE_PROVIDER
      value: redis
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      digest: sha256:cf866b6ab8c752b7839f16b686e01684a67b4a61b69f5bad4007147944bdc0a3
      registry: ghcr.io
      repository: teableio/teable
      tag: null
    port: 3000
    volumeMounts:
    - mountPath: /app/.assets
      name: vol-data
