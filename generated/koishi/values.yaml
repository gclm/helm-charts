configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 5140
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /koishi
    size: 10Gi
secrets: {}
services:
  koishi:
    env:
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: koishijs/koishi
      tag: v1.16.0
    port: 5140
    volumeMounts:
    - mountPath: /koishi
      name: vol-data
