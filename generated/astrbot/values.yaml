configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 6185
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /AstrBot/data
    size: 10Gi
secrets: {}
services:
  astrbot:
    env:
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: soulter/astrbot
      tag: v4.29.3
    port: 6185
    volumeMounts:
    - mountPath: /AstrBot/data
      name: vol-data
