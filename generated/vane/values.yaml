configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
persistence:
  vol-data:
    mountPath: /home/vane/data
    size: 10Gi
secrets: {}
services:
  vane:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: itzcrazykns1337/vane
      tag: v1.12.2
    port: 3000
    volumeMounts:
    - mountPath: /home/vane/data
      name: vol-data
