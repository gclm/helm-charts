configMaps: {}
env:
  ADMIN_USERNAME: admin
  PANEL_APP_PORT_HTTP: 5797
persistence:
  vol-data:
    mountPath: /data
    size: 10Gi
secrets:
  ADMIN_PASSWORD:
    generate: true
services:
  archivebox:
    env:
    - name: ADMIN_USERNAME
      valueFromEnv: ADMIN_USERNAME
    - name: ADMIN_PASSWORD
      valueFromSecret: ADMIN_PASSWORD
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: archivebox/archivebox
      tag: 0.9.73
    port: 5797
    volumeMounts:
    - mountPath: /data
      name: vol-data
