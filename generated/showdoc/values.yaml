configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 4999
persistence:
  vol-showdocdata-html:
    mountPath: /var/www/html
    size: 10Gi
secrets: {}
services:
  showdoc:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: star7th/showdoc
      tag: v3.9.5
    port: 80
    volumeMounts:
    - mountPath: /var/www/html
      name: vol-showdocdata-html
