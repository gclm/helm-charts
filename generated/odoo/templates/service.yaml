{{- range $name, $svc := .Values.services }}
{{- if $svc.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - {name: http, port: {{ $svc.port }}, targetPort: http}
---
{{- end }}
{{- end }}
