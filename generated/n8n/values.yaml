configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 5678
persistence:
  vol-data:
    mountPath: /home/node/.n8n
    size: 10Gi
secrets: {}
services:
  n8n:
    env:
    - name: N8N_SECURE_COOKIE
      value: 'False'
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: n8nio/n8n
      tag: 2.44.3
    port: 5678
    volumeMounts:
    - mountPath: /home/node/.n8n
      name: vol-data
