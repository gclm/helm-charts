configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
persistence:
  vol-data:
    mountPath: /var/lib/grafana
    size: 10Gi
secrets: {}
services:
  grafana:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: grafana/grafana
      tag: 13.2.4
    port: 3000
    volumeMounts:
    - mountPath: /var/lib/grafana
      name: vol-data
