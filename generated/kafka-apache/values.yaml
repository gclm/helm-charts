configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 9092
persistence:
  vol-data:
    mountPath: /var/lib/kafka/data
    size: 10Gi
secrets: {}
services:
  kafka-apache:
    command:
    - /bin/bash
    - -ec
    - "if [ -f \"$$KAFKA_LOG_DIRS/meta.properties\" ]; then\n  CLUSTER_ID=$$(sed -n\
      \ 's/^cluster[.]id=//p' \"$$KAFKA_LOG_DIRS/meta.properties\")\n  test -n \"\
      $$CLUSTER_ID\"\nelse\n  CLUSTER_ID=$$(/opt/kafka/bin/kafka-storage.sh random-uuid)\n\
      fi\nexport CLUSTER_ID\nexec /etc/kafka/docker/run\n"
    env:
    - name: KAFKA_NODE_ID
      value: '1'
    - name: KAFKA_PROCESS_ROLES
      value: broker,controller
    - name: KAFKA_LISTENERS
      value: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
    - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
      value: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
    - name: KAFKA_INTER_BROKER_LISTENER_NAME
      value: PLAINTEXT
    - name: KAFKA_CONTROLLER_LISTENER_NAMES
      value: CONTROLLER
    - name: KAFKA_CONTROLLER_QUORUM_VOTERS
      value: 1@localhost:29093
    - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
      value: '1'
    - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
      value: '1'
    - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
      value: '1'
    - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
      value: '1'
    - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
      value: '1'
    - name: KAFKA_LOG_DIRS
      value: /var/lib/kafka/data
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: apache/kafka
      tag: 4.4.0
    port: 9092
    volumeMounts:
    - mountPath: /var/lib/kafka/data
      name: vol-data
