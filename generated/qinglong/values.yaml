configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 5700
persistence:
  vol-data:
    mountPath: /ql/data
    size: 10Gi
secrets: {}
services:
  qinglong:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: whyour/qinglong
      tag: 2.24.0-debian
    port: 5700
    volumeMounts:
    - mountPath: /ql/data
      name: vol-data
