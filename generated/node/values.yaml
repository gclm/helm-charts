configMaps: {}
env: {}
persistence:
  vol-env:
    mountPath: /.env
    size: 10Gi
  vol-run-sh:
    mountPath: /run.sh
    size: 10Gi
secrets: {}
services:
  node:
    command:
    - bash /run.sh
    env: []
    image:
      registry: ''
      repository: 1panel/node
      tag: ${NODE_VERSION}
    volumeMounts:
    - mountPath: /run.sh
      name: vol-run-sh
    - mountPath: /.env
      name: vol-env
