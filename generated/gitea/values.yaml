configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
  PANEL_DB_NAME: gitea
  PANEL_DB_TYPE: mysql
  PANEL_DB_USER: gitea
persistence:
  vol-data:
    mountPath: /data
    size: 10Gi
secrets:
  PANEL_DB_USER_PASSWORD:
    generate: true
services:
  gitea:
    env:
    - name: USER_UID
      value: '1000'
    - name: USER_GID
      value: '1000'
    - name: GITEA__database__DB_TYPE
      valueFromEnv: PANEL_DB_TYPE
    - name: GITEA__database__NAME
      valueFromEnv: PANEL_DB_NAME
    - name: GITEA__database__USER
      valueFromEnv: PANEL_DB_USER
    - name: GITEA__database__PASSWD
      valueFromSecret: PANEL_DB_USER_PASSWORD
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: commitgo/gitea-ee
      tag: 27.3.9
    port: 3000
    volumeMounts:
    - mountPath: /data
      name: vol-data
