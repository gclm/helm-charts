configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8008
persistence:
  vol-data:
    mountPath: /dashboard/data
    size: 10Gi
secrets: {}
services:
  dashboard:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ghcr.io
      repository: nezhahq/nezha
      tag: v2.3.18
    port: 8008
    volumeMounts:
    - mountPath: /dashboard/data
      name: vol-data
