configMaps: {}
env:
  ATK_LOCALE: zh-CN
  ATK_SITE_DEFAULT: My Blog Site
  ATK_SITE_URL: https://example.myblog.com
  PANEL_APP_PORT_HTTP: '23366'
  TZ: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /data
    size: 10Gi
secrets: {}
services:
  artalk:
    env:
    - name: ATK_SITE_DEFAULT
      valueFromEnv: ATK_SITE_DEFAULT
    - name: ATK_SITE_URL
      valueFromEnv: ATK_SITE_URL
    - name: ATK_LOCALE
      valueFromEnv: ATK_LOCALE
    - name: TZ
      valueFromEnv: TZ
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: artalk/artalk-go
      tag: '2.10'
    port: 23366
    volumeMounts:
    - mountPath: /data
      name: vol-data
