configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8081
persistence:
  vol-site:
    mountPath: /var/www/html
    size: 10Gi
secrets: {}
services:
  kodbox:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: kodcloud/kodbox
      tag: v1.4505
    port: 80
    volumeMounts:
    - mountPath: /var/www/html
      name: vol-site
