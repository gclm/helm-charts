configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40063
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  twikoo:
    env:
    - name: TWIKOO_THROTTLE
      value: '1000'
    - name: TWIKOO_PORT
      value: '8080'
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: imaegoo/twikoo
      tag: 2.0.15
    port: 8080
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
