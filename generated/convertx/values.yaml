configMaps: {}
env: {}
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  convertx:
    env:
    - name: HTTP_ALLOWED
      value: 'true'
    - name: ACCOUNT_REGISTRATION
      value: 'true'
    image:
      registry: ''
      repository: c4illin/convertx
      tag: v0.19.0
    port: 3000
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
