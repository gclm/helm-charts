configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  convertx:
    env:
    - name: HTTP_ALLOWED
      value: 'true'
    - name: ACCOUNT_REGISTRATION
      value: 'true'
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: c4illin/convertx
      tag: v0.20.0
    port: 3000
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
