configMaps: {}
env:
  GOTIFY_DATABASE_CONNECTION: data/gotify.db
  GOTIFY_DATABASE_DIALECT: sqlite3
  GOTIFY_DEFAULTUSER_NAME: admin
  GOTIFY_PASSSTRENGTH: 10
  GOTIFY_PLUGINSDIR: data/plugins
  GOTIFY_REGISTRATION: 'false'
  GOTIFY_SERVER_CORS_ALLOWHEADERS: ''
  GOTIFY_SERVER_CORS_ALLOWMETHODS: ''
  GOTIFY_SERVER_CORS_ALLOWORIGINS: ''
  GOTIFY_SERVER_KEEPALIVEPERIODSECONDS: 0
  GOTIFY_SERVER_LISTENADDR: ''
  GOTIFY_SERVER_PORT: '80'
  GOTIFY_SERVER_RESPONSEHEADERS: ''
  GOTIFY_SERVER_SSL_CERTFILE: ''
  GOTIFY_SERVER_SSL_CERTKEY: ''
  GOTIFY_SERVER_SSL_ENABLED: 'false'
  GOTIFY_SERVER_SSL_LETSENCRYPT_ACCEPTTOS: 'false'
  GOTIFY_SERVER_SSL_LETSENCRYPT_CACHE: data/certs
  GOTIFY_SERVER_SSL_LETSENCRYPT_ENABLED: 'false'
  GOTIFY_SERVER_SSL_LETSENCRYPT_HOSTS: ''
  GOTIFY_SERVER_SSL_LISTENADDR: ''
  GOTIFY_SERVER_SSL_PORT: 443
  GOTIFY_SERVER_SSL_REDIRECTTOHTTPS: 'true'
  GOTIFY_SERVER_STREAM_ALLOWEDORIGINS: ''
  GOTIFY_SERVER_STREAM_PINGPERIODSECONDS: 45
  GOTIFY_UPLOADEDIMAGESDIR: data/images
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets:
  GOTIFY_DEFAULTUSER_PASS:
    generate: true
services:
  gotify:
    env:
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: GOTIFY_SERVER_PORT
      valueFromEnv: GOTIFY_SERVER_PORT
    - name: GOTIFY_SERVER_KEEPALIVEPERIODSECONDS
      valueFromEnv: GOTIFY_SERVER_KEEPALIVEPERIODSECONDS
    - name: GOTIFY_SERVER_LISTENADDR
      valueFromEnv: GOTIFY_SERVER_LISTENADDR
    - name: GOTIFY_SERVER_SSL_ENABLED
      valueFromEnv: GOTIFY_SERVER_SSL_ENABLED
    - name: GOTIFY_SERVER_SSL_REDIRECTTOHTTPS
      valueFromEnv: GOTIFY_SERVER_SSL_REDIRECTTOHTTPS
    - name: GOTIFY_SERVER_SSL_LISTENADDR
      valueFromEnv: GOTIFY_SERVER_SSL_LISTENADDR
    - name: GOTIFY_SERVER_SSL_PORT
      valueFromEnv: GOTIFY_SERVER_SSL_PORT
    - name: GOTIFY_SERVER_SSL_CERTFILE
      valueFromEnv: GOTIFY_SERVER_SSL_CERTFILE
    - name: GOTIFY_SERVER_SSL_CERTKEY
      valueFromEnv: GOTIFY_SERVER_SSL_CERTKEY
    - name: GOTIFY_SERVER_SSL_LETSENCRYPT_ENABLED
      valueFromEnv: GOTIFY_SERVER_SSL_LETSENCRYPT_ENABLED
    - name: GOTIFY_SERVER_SSL_LETSENCRYPT_ACCEPTTOS
      valueFromEnv: GOTIFY_SERVER_SSL_LETSENCRYPT_ACCEPTTOS
    - name: GOTIFY_SERVER_SSL_LETSENCRYPT_CACHE
      valueFromEnv: GOTIFY_SERVER_SSL_LETSENCRYPT_CACHE
    - name: GOTIFY_SERVER_SSL_LETSENCRYPT_HOSTS
      valueFromEnv: GOTIFY_SERVER_SSL_LETSENCRYPT_HOSTS
    - name: GOTIFY_SERVER_RESPONSEHEADERS
      valueFromEnv: GOTIFY_SERVER_RESPONSEHEADERS
    - name: GOTIFY_SERVER_CORS_ALLOWORIGINS
      valueFromEnv: GOTIFY_SERVER_CORS_ALLOWORIGINS
    - name: GOTIFY_SERVER_CORS_ALLOWMETHODS
      valueFromEnv: GOTIFY_SERVER_CORS_ALLOWMETHODS
    - name: GOTIFY_SERVER_CORS_ALLOWHEADERS
      valueFromEnv: GOTIFY_SERVER_CORS_ALLOWHEADERS
    - name: GOTIFY_SERVER_STREAM_ALLOWEDORIGINS
      valueFromEnv: GOTIFY_SERVER_STREAM_ALLOWEDORIGINS
    - name: GOTIFY_SERVER_STREAM_PINGPERIODSECONDS
      valueFromEnv: GOTIFY_SERVER_STREAM_PINGPERIODSECONDS
    - name: GOTIFY_DATABASE_DIALECT
      valueFromEnv: GOTIFY_DATABASE_DIALECT
    - name: GOTIFY_DATABASE_CONNECTION
      valueFromEnv: GOTIFY_DATABASE_CONNECTION
    - name: GOTIFY_DEFAULTUSER_NAME
      valueFromEnv: GOTIFY_DEFAULTUSER_NAME
    - name: GOTIFY_DEFAULTUSER_PASS
      valueFromSecret: GOTIFY_DEFAULTUSER_PASS
    - name: GOTIFY_PASSSTRENGTH
      valueFromEnv: GOTIFY_PASSSTRENGTH
    - name: GOTIFY_UPLOADEDIMAGESDIR
      valueFromEnv: GOTIFY_UPLOADEDIMAGESDIR
    - name: GOTIFY_PLUGINSDIR
      valueFromEnv: GOTIFY_PLUGINSDIR
    - name: GOTIFY_REGISTRATION
      valueFromEnv: GOTIFY_REGISTRATION
    image:
      registry: ''
      repository: gotify/server
      tag: 3.1.1
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
