configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40157
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  filecodebox:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: lanol/filecodebox
      tag: 2.8.4
    port: 12345
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
