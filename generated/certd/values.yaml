configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 7001
persistence:
  vol-data-certd:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  certd:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: greper/certd
      tag: 1.45.3
    port: 7001
    volumeMounts:
    - mountPath: /app/data
      name: vol-data-certd
