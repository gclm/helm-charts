configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40031
persistence:
  vol-data:
    mountPath: /data
    size: 10Gi
secrets: {}
services:
  bitwarden:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: vaultwarden/server
      tag: 1.37.4-alpine
    port: 80
    volumeMounts:
    - mountPath: /data
      name: vol-data
