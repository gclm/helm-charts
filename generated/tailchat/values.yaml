configMaps: {}
env:
  ADMIN_PASSWORD: admin-password
  ADMIN_USERNAME: tailchat
  API_URL: http://localhost:11000
  PANEL_APP_PORT_ADMIN: 11002
  PANEL_APP_PORT_HTTP: 11000
  PANEL_MINIO_ROOT_PASSWORD: ''
  PANEL_MINIO_ROOT_USER: ''
  SECRET: any-random-text
  SMTP_SENDER: ''
  SMTP_URI: ''
persistence: {}
secrets: {}
services:
  tailchat:
    env:
    - name: SERVICEDIR
      value: services,plugins
    - name: LOGGER
      value: 'true'
    - name: LOGLEVEL
      value: info
    - name: PORT
      value: '11000'
    - name: MINIO_USER
      valueFromEnv: PANEL_MINIO_ROOT_USER
    - name: MINIO_PASS
      valueFromEnv: PANEL_MINIO_ROOT_PASSWORD
    - name: SMTP_SENDER
      valueFromEnv: SMTP_SENDER
    - name: SMTP_URI
      valueFromEnv: SMTP_URI
    - name: SECRET
      valueFromEnv: SECRET
    - name: API_URL
      valueFromEnv: API_URL
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: moonrailgun/tailchat
      tag: 1.11.18
    port: 11000
    volumeMounts: []
  tailchat-admin:
    command:
    - pnpm start:admin
    env:
    - name: ADMIN_PORT
      value: '3000'
    - name: ADMIN_USER
      valueFromEnv: ADMIN_USERNAME
    - name: ADMIN_PASS
      valueFromEnv: ADMIN_PASSWORD
    - name: LOGGER
      value: 'true'
    - name: LOGLEVEL
      value: info
    - name: MINIO_USER
      valueFromEnv: PANEL_MINIO_ROOT_USER
    - name: MINIO_PASS
      valueFromEnv: PANEL_MINIO_ROOT_PASSWORD
    - name: SMTP_SENDER
      valueFromEnv: SMTP_SENDER
    - name: SMTP_URI
      valueFromEnv: SMTP_URI
    - name: SECRET
      valueFromEnv: SECRET
    - name: API_URL
      valueFromEnv: API_URL
    - name: PANEL_APP_PORT_ADMIN
      valueFromEnv: PANEL_APP_PORT_ADMIN
    image:
      registry: ''
      repository: moonrailgun/tailchat
      tag: 1.11.18
    port: 3000
    volumeMounts: []
