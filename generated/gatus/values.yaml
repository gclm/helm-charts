configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /data/
    size: 10Gi
secrets: {}
services:
  gatus:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: twinproduction/gatus
      tag: v5.37.0
    port: 8080
    volumeMounts:
    - mountPath: /data/
      name: vol-data
