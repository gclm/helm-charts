configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /bitnami/tomcat
    size: 10Gi
secrets:
  TOMCAT_PASSWORD:
    generate: true
services:
  nexus:
    env:
    - name: TOMCAT_PASSWORD
      valueFromSecret: TOMCAT_PASSWORD
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: bitnamilegacy/tomcat
      tag: 10.1.43
    port: 8080
    volumeMounts:
    - mountPath: /bitnami/tomcat
      name: vol-data
