configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40078
persistence:
  vol-data-games-storage:
    mountPath: /games_storage
    size: 10Gi
secrets: {}
services:
  dosgame:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: firezmc/dosgame-web-docker
      tag: v3.9.6
    port: 8090
    volumeMounts:
    - mountPath: /games_storage
      name: vol-data-games-storage
