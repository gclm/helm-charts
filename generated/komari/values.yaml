configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 25774
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  dashboard:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ghcr.io
      repository: komari-monitor/komari
      tag: 1.5.1
    port: 25774
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
