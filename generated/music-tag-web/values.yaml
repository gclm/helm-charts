configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8001
persistence:
  vol-data:
    mountPath: /app/media
    size: 10Gi
secrets: {}
services:
  music-tag-web:
    command:
    - /start
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: xhongc/music_tag_web
      tag: 2.8.0
    port: 8001
    volumeMounts:
    - mountPath: /app/media
      name: vol-data
