configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40145
persistence: {}
secrets: {}
services:
  kkfileview:
    env:
    - name: KK_TRUST_HOST
      value: ${KK_TRUST_HOST:-default}
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: registry.cn-hangzhou.aliyuncs.com
      repository: jeecgdocker/kkfileview
      tag: 5.0.3
    port: 8012
    volumeMounts: []
