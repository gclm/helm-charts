configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40026
persistence: {}
secrets: {}
services:
  synapse:
    command:
    - run -m synapse.app.homeserver --config-path=/data/homeserver.yaml
    env:
    - name: TZ
      value: Asia/Shanghai
    - name: UID
      value: '1000'
    - name: GID
      value: '1000'
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: matrixdotorg/synapse
      tag: v1.163.1
    port: 8008
    volumeMounts: []
