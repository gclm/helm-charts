configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 6157
persistence:
  vol-data:
    mountPath: /opengist
    size: 10Gi
secrets: {}
services:
  opengist:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ghcr.io
      repository: thomiceli/opengist
      tag: 1.15.2
    port: 6157
    volumeMounts:
    - mountPath: /opengist
      name: vol-data
