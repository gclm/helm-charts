configMaps: {}
env: {}
persistence:
  vol-env:
    mountPath: /.env
    size: 10Gi
  vol-run-sh:
    mountPath: /run.sh
    size: 10Gi
secrets: {}
services:
  dotnet:
    command:
    - bash /run.sh
    env: []
    image:
      registry: mcr.microsoft.com
      repository: dotnet/aspnet
      tag: ${DOTNET_VERSION}
    volumeMounts:
    - mountPath: /run.sh
      name: vol-run-sh
    - mountPath: /.env
      name: vol-env
