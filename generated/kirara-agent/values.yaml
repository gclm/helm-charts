configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets: {}
services:
  kirara-agent:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: lss233/kirara-agent-framework
      tag: v3.2.0
    port: 8080
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
