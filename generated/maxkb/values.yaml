configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /opt/maxkb
    size: 10Gi
secrets: {}
services:
  maxkb:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: 1panel/maxkb
      tag: v2.10.6-lts
    port: 8080
    volumeMounts:
    - mountPath: /opt/maxkb
      name: vol-data
