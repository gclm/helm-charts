configMaps: {}
env:
  OLLAMA_BASE_URL: 示例：http://192.168.10.100:11434
  PANEL_APP_PORT_HTTP: 3000
persistence:
  vol-data:
    mountPath: /app/backend/data
    size: 10Gi
secrets:
  WEBUI_SECRET_KEY:
    generate: true
services:
  open-webui:
    env:
    - name: OLLAMA_BASE_URL
      valueFromEnv: OLLAMA_BASE_URL
    - name: WEBUI_SECRET_KEY
      valueFromSecret: WEBUI_SECRET_KEY
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ghcr.io
      repository: open-webui/open-webui
      tag: v0.12.3
    port: 8080
    volumeMounts:
    - mountPath: /app/backend/data
      name: vol-data
