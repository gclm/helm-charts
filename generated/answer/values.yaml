configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40065
persistence:
  vol-data:
    mountPath: /data
    size: 10Gi
secrets: {}
services:
  answer:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: apache/answer
      tag: 2.0.3
    port: 80
    volumeMounts:
    - mountPath: /data
      name: vol-data
