configMaps: {}
env:
  PANEL_API_KEY: ''
  PANEL_BASE_URL: ''
persistence:
  vol-data:
    mountPath: /app/data
    size: 10Gi
secrets:
  INIT_ADMIN_PASSWORD:
    generate: true
services:
  app:
    env:
    - name: INIT_ADMIN_PASSWORD
      valueFromSecret: INIT_ADMIN_PASSWORD
    - name: PANEL_BASE_URL
      valueFromEnv: PANEL_BASE_URL
    - name: PANEL_API_KEY
      valueFromEnv: PANEL_API_KEY
    image:
      registry: ''
      repository: 1panel/ai-portal
      tag: v1.0.10
    port: 3000
    probe:
      exec: 'CMD node -e require(''http'').get(''http://localhost:3000/api/health'',
        (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on(''error'',
        () => process.exit(1))'
      intervalSeconds: 30
      retries: 3
      timeoutSeconds: 5
    volumeMounts:
    - mountPath: /app/data
      name: vol-data
