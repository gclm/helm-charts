configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8081
persistence:
  vol-data:
    mountPath: /nexus-data
    size: 10Gi
secrets: {}
services:
  nexus:
    env:
    - name: TZ
      value: Asia/Shanghai
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: sonatype/nexus3
      tag: 3.97.0
    port: 8081
    volumeMounts:
    - mountPath: /nexus-data
      name: vol-data
