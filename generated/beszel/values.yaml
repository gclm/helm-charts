configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8090
persistence:
  vol-data-data:
    mountPath: /beszel_data
    size: 10Gi
  vol-data-socket:
    mountPath: /beszel_socket
    size: 10Gi
secrets: {}
services:
  beszel:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: henrygd/beszel
      tag: 0.21.1
    port: 8090
    volumeMounts:
    - mountPath: /beszel_data
      name: vol-data-data
    - mountPath: /beszel_socket
      name: vol-data-socket
