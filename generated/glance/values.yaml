configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data-glance-yml:
    mountPath: /app/config/glance.yml
    size: 10Gi
secrets: {}
services:
  glance:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: glanceapp/glance
      tag: v0.8.7
    port: 8080
    volumeMounts:
    - mountPath: /app/config/glance.yml
      name: vol-data-glance-yml
