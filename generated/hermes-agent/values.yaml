configMaps: {}
env: {}
persistence:
  vol-data:
    mountPath: /opt/data
    size: 10Gi
secrets: {}
services:
  hermes-agent:
    env:
    - name: HOME
      value: /opt/data/home
    - name: HERMES_HOME
      value: /opt/data
    - name: HERMES_DASHBOARD
      value: '1'
    - name: HERMES_DASHBOARD_HOST
      value: 0.0.0.0
    - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      value: ${HERMES_DASHBOARD_USERNAME:-admin}
    - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      value: ${HERMES_DASHBOARD_PASSWORD:-changeme}
    - name: HERMES_DASHBOARD_PORT
      value: '9119'
    - name: TERM
      value: xterm-256color
    image:
      registry: ''
      repository: 1panel/hermes-agent
      tag: 2026.9.24
    port: 9119
    volumeMounts:
    - mountPath: /opt/data
      name: vol-data
