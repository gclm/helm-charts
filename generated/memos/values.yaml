configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 5230
persistence:
  vol-memos:
    mountPath: /var/opt/memos
    size: 10Gi
secrets: {}
services:
  memos:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: neosmemo/memos
      tag: 0.31.0
    port: 5230
    volumeMounts:
    - mountPath: /var/opt/memos
      name: vol-memos
