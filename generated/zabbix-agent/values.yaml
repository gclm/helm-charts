configMaps: {}
env:
  PANEL_APP_PORT_AGENT: 10050
  ZABBIX_HOSTNAME: ''
  ZABBIX_SERVER: ''
  ZABBIX_SERVER_PORT: 10051
persistence: {}
secrets: {}
services:
  zabbix-agent:
    env:
    - name: ZBX_HOSTNAME
      valueFromEnv: ZABBIX_HOSTNAME
    - name: ZBX_SERVER_HOST
      valueFromEnv: ZABBIX_SERVER
    - name: ZBX_SERVER_PORT
      valueFromEnv: ZABBIX_SERVER_PORT
    - name: PANEL_APP_PORT_AGENT
      valueFromEnv: PANEL_APP_PORT_AGENT
    image:
      registry: ''
      repository: zabbix/zabbix-agent
      tag: alpine-7.4.5
    port: 10050
    volumeMounts: []
