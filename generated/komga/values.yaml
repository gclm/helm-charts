configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 25600
persistence:
  vol-data:
    mountPath: /data
    size: 10Gi
secrets: {}
services:
  komga:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: gotson/komga
      tag: 1.29.1
    port: 25600
    volumeMounts:
    - mountPath: /data
      name: vol-data
