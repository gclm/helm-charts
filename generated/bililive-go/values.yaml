configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /srv/bililive
    size: 10Gi
secrets: {}
services:
  bililive-go:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: chigusa/bililive-go
      tag: v0.8.3
    port: 8080
    volumeMounts:
    - mountPath: /srv/bililive
      name: vol-data
