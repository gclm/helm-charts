configMaps: {}
env: {}
persistence: {}
secrets: {}
services:
  browserless:
    env: []
    image:
      registry: ghcr.io
      repository: browserless/chrome
      tag: v2.57.0
    port: 3000
    probe:
      exec: CMD curl -f http://localhost:3000/pressure
      intervalSeconds: 30
      retries: 3
      timeoutSeconds: 10
    volumeMounts: []
