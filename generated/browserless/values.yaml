configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
persistence: {}
secrets: {}
services:
  browserless:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ghcr.io
      repository: browserless/chrome
      tag: v2.57.2
    port: 3000
    probe:
      exec: CMD curl -f http://localhost:3000/pressure
      intervalSeconds: 30
      retries: 3
      timeoutSeconds: 10
    volumeMounts: []
