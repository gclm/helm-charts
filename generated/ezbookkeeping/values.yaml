configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data-data:
    mountPath: /ezbookkeeping/data
    size: 10Gi
  vol-data-log:
    mountPath: /ezbookkeeping/log
    size: 10Gi
  vol-data-storage:
    mountPath: /ezbookkeeping/storage
    size: 10Gi
secrets: {}
services:
  ezbookkeeping:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: mayswind/ezbookkeeping
      tag: 2.0.1
    port: 8080
    volumeMounts:
    - mountPath: /ezbookkeeping/data
      name: vol-data-data
    - mountPath: /ezbookkeeping/storage
      name: vol-data-storage
    - mountPath: /ezbookkeeping/log
      name: vol-data-log
