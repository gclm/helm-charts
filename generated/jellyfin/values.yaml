configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8096
persistence:
  vol-data-config:
    mountPath: /config
    size: 10Gi
secrets: {}
services:
  jellyfin:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: jellyfin/jellyfin
      tag: 10.11.11
    port: 8096
    volumeMounts:
    - mountPath: /config
      name: vol-data-config
