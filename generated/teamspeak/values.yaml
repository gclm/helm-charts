configMaps: {}
env:
  PANEL_DB_NAME: teamspeak
  PANEL_DB_USER: teamspeak
  TS3SERVER_VOICE_PORT: 9987
persistence:
  vol-data:
    mountPath: /var/ts3server
    size: 10Gi
secrets:
  PANEL_DB_USER_PASSWORD:
    generate: true
services:
  teamspeak:
    env:
    - name: TS3SERVER_DB_WAITUNTILREADY
      value: '30'
    - name: TS3SERVER_LICENSE
      value: accept
    - name: TS3SERVER_DB_NAME
      valueFromEnv: PANEL_DB_NAME
    - name: TS3SERVER_DB_USER
      valueFromEnv: PANEL_DB_USER
    - name: TS3SERVER_DB_PASSWORD
      valueFromSecret: PANEL_DB_USER_PASSWORD
    - name: TS3SERVER_VOICE_PORT
      valueFromEnv: TS3SERVER_VOICE_PORT
    image:
      registry: ''
      repository: teamspeak
      tag: 3.13.8
    port: 9987
    volumeMounts:
    - mountPath: /var/ts3server
      name: vol-data
