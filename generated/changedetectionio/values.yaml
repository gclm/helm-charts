configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40097
persistence:
  vol-data:
    mountPath: /datastore
    size: 10Gi
secrets: {}
services:
  changedetection:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: dgtlmoon/changedetection.io
      tag: 0.60.9
    port: 5000
    volumeMounts:
    - mountPath: /datastore
      name: vol-data
