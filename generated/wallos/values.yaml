configMaps: {}
env:
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data-db:
    mountPath: /var/www/html/db
    size: 10Gi
  vol-data-logos:
    mountPath: /var/www/html/images/uploads/logos
    size: 10Gi
secrets: {}
services:
  wallos:
    env:
    - name: TZ
      valueFromEnv: TIME_ZONE
    image:
      registry: ''
      repository: bellamy/wallos
      tag: 5.8.3
    port: 80
    probe:
      exec: NONE
      intervalSeconds: 10
      retries: 3
      timeoutSeconds: 3
    volumeMounts:
    - mountPath: /var/www/html/db
      name: vol-data-db
    - mountPath: /var/www/html/images/uploads/logos
      name: vol-data-logos
