configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 11434
persistence:
  vol-data:
    mountPath: /root/.ollama
    size: 10Gi
secrets: {}
services:
  ollama:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: ollama/ollama
      tag: 0.40.7
    port: 11434
    volumeMounts:
    - mountPath: /root/.ollama
      name: vol-data
