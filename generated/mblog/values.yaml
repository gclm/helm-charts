configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 38321
persistence:
  vol-data:
    mountPath: /opt/mblog
    size: 10Gi
secrets: {}
services:
  halo:
    env:
    - name: DB_TYPE
      value: -sqlite
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: kingwrcy/mblog
      tag: 1.1.0
    port: 38321
    volumeMounts:
    - mountPath: /opt/mblog
      name: vol-data
