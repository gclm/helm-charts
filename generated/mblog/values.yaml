configMaps: {}
env: {}
persistence:
  vol-data:
    mountPath: /opt/mblog
    size: 10Gi
secrets: {}
services:
  halo:
    env:
    - name: DB_TYPE
      value: -sqlite
    image:
      registry: ''
      repository: kingwrcy/mblog
      tag: 1.1.0
    port: 38321
    volumeMounts:
    - mountPath: /opt/mblog
      name: vol-data
