configMaps: {}
env: {}
persistence:
  vol-data-extraconfigs:
    mountPath: /configs
    size: 10Gi
  vol-data-trainingdata:
    mountPath: /usr/share/tesseract-ocr/5/tessdata
    size: 10Gi
secrets: {}
services:
  stirling-pdf:
    env:
    - name: DOCKER_ENABLE_SECURITY
      value: 'false'
    image:
      registry: ''
      repository: frooodle/s-pdf
      tag: 3.1.0
    port: 8080
    volumeMounts:
    - mountPath: /usr/share/tesseract-ocr/5/tessdata
      name: vol-data-trainingdata
    - mountPath: /configs
      name: vol-data-extraconfigs
