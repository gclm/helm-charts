configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data-extraconfigs:
    mountPath: /configs
    size: 10Gi
  vol-data-trainingdata:
    mountPath: /usr/share/tesseract-ocr/5/tessdata
    size: 10Gi
secrets: {}
services:
  stirling-pdf:
    env:
    - name: DOCKER_ENABLE_SECURITY
      value: 'false'
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: frooodle/s-pdf
      tag: 3.2.0
    port: 8080
    volumeMounts:
    - mountPath: /usr/share/tesseract-ocr/5/tessdata
      name: vol-data-trainingdata
    - mountPath: /configs
      name: vol-data-extraconfigs
