configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40096
persistence:
  vol-data-audiobooks:
    mountPath: /audiobooks
    size: 10Gi
  vol-data-config:
    mountPath: /config
    size: 10Gi
  vol-data-metadata:
    mountPath: /metadata
    size: 10Gi
  vol-data-podcasts:
    mountPath: /podcasts
    size: 10Gi
secrets: {}
services:
  audiobookshelf:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: advplyr/audiobookshelf
      tag: 2.37.2
    port: 80
    volumeMounts:
    - mountPath: /audiobooks
      name: vol-data-audiobooks
    - mountPath: /podcasts
      name: vol-data-podcasts
    - mountPath: /config
      name: vol-data-config
    - mountPath: /metadata
      name: vol-data-metadata
