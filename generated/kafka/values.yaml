configMaps:
  conf:
    data:
      server.properties: 'node.id=0

        process.roles=controller,broker

        listeners=PLAINTEXT://:9092,CONTROLLER://:9093

        # An empty advertised hostname resolves to the container hostname.

        advertised.listeners=PLAINTEXT://:9092

        listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

        controller.quorum.voters=0@127.0.0.1:9093

        controller.listener.names=CONTROLLER

        log.dirs=/bitnami/kafka/data


        offsets.topic.replication.factor=1

        transaction.state.log.replication.factor=1

        transaction.state.log.min.isr=1


        log.retention.ms=60000

        message.max.bytes=524288000

        replica.fetch.max.bytes=524288000

        '
    mounts:
    - mountPath: /opt/bitnami/kafka/config/server.properties
      subPath: server.properties
env:
  PANEL_APP_PORT_HTTP: 9092
persistence:
  vol-data:
    mountPath: /bitnami/kafka/data
    size: 10Gi
secrets: {}
services:
  kafka:
    env:
    - name: KAFKA_HEAP_OPTS
      value: -Xmx512m -Xms256m
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: bitnamilegacy/kafka
      tag: 4.0.0
    port: 9092
    volumeMounts:
    - mountPath: /bitnami/kafka/data
      name: vol-data
    - mountPath: /opt/bitnami/kafka/config/server.properties
      name: conf
      subPath: server.properties
