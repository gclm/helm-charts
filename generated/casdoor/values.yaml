configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8000
  PANEL_DB_NAME: casdoor
persistence: {}
secrets: {}
services:
  casdoor:
    env:
    - name: RUNNING_IN_DOCKER
      value: 'true'
    - name: dbName
      valueFromEnv: PANEL_DB_NAME
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: casbin/casdoor
      tag: 4.20.0
    port: 8000
    volumeMounts: []
