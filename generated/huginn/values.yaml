configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
persistence:
  vol-data:
    mountPath: /var/lib/mysql
    size: 10Gi
secrets: {}
services:
  huginn:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ghcr.io
      repository: huginn/huginn
      tag: v2026.10.26
    port: 3000
    volumeMounts:
    - mountPath: /var/lib/mysql
      name: vol-data
