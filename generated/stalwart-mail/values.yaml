configMaps: {}
env:
  PANEL_APP_PORT_HTTPS: 443
persistence:
  vol-data:
    mountPath: /opt/stalwart
    size: 10Gi
secrets: {}
services:
  stalwart-mail:
    env:
    - name: PANEL_APP_PORT_HTTPS
      valueFromEnv: PANEL_APP_PORT_HTTPS
    image:
      registry: ''
      repository: stalwartlabs/stalwart
      tag: v1.0.1-alpine
    port: 443
    volumeMounts:
    - mountPath: /opt/stalwart
      name: vol-data
