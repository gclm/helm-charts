configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40071
persistence:
  vol-database:
    mountPath: /database
    size: 10Gi
secrets: {}
services:
  filebrowser:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: filebrowser/filebrowser
      tag: v2.63.23
    port: 80
    volumeMounts:
    - mountPath: /database
      name: vol-database
