configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /var/opt/bytebase
    size: 10Gi
secrets: {}
services:
  bytebase:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: bytebase/bytebase
      tag: 3.23.1
    port: 8080
    volumeMounts:
    - mountPath: /var/opt/bytebase
      name: vol-data
