configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 40061
  TIME_ZONE: Asia/Shanghai
persistence:
  vol-data-config:
    mountPath: /app/web/config
    size: 10Gi
  vol-data-i:
    mountPath: /app/web/i
    size: 10Gi
secrets: {}
services:
  easyimage:
    env:
    - name: TZ
      valueFromEnv: TIME_ZONE
    - name: PUID
      value: '1000'
    - name: PGID
      value: '1000'
    - name: DEBUG
      value: 'false'
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: ddsderek/easyimage
      tag: v2.8.7
    port: 80
    volumeMounts:
    - mountPath: /app/web/config
      name: vol-data-config
    - mountPath: /app/web/i
      name: vol-data-i
