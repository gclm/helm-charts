configMaps: {}
env: {}
persistence:
  vol-data:
    mountPath: /app/langflow
    size: 10Gi
secrets: {}
services:
  langflow:
    env:
    - name: LANGFLOW_CONFIG_DIR
      value: app/langflow
    image:
      registry: ''
      repository: langflowai/langflow
      tag: 1.12.6
    port: 7860
    volumeMounts:
    - mountPath: /app/langflow
      name: vol-data
