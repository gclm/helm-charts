configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 7860
persistence:
  vol-data:
    mountPath: /app/langflow
    size: 10Gi
secrets: {}
services:
  langflow:
    env:
    - name: LANGFLOW_CONFIG_DIR
      value: app/langflow
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: langflowai/langflow
      tag: 1.12.7
    port: 7860
    volumeMounts:
    - mountPath: /app/langflow
      name: vol-data
