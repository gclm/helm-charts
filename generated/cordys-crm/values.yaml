configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8081
persistence:
  vol-data:
    mountPath: /opt/cordys
    size: 10Gi
secrets: {}
services:
  cordys-crm:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: 1panel/cordys-crm
      tag: v1.9.6
    port: 8081
    volumeMounts:
    - mountPath: /opt/cordys
      name: vol-data
