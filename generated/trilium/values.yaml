configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 8080
persistence:
  vol-data:
    mountPath: /home/node/trilium-data
    size: 10Gi
secrets: {}
services:
  trilium:
    env:
    - name: TRILIUM_DATA_DIR
      value: /home/node/trilium-data
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: triliumnext/trilium
      tag: v0.106.0
    port: 8080
    volumeMounts:
    - mountPath: /home/node/trilium-data
      name: vol-data
