configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 3000
  PANEL_DB_HOST: ''
  PANEL_DB_NAME: wiki
  PANEL_DB_USER: wikijs
persistence: {}
secrets:
  PANEL_DB_USER_PASSWORD:
    generate: true
services:
  wiki:
    env:
    - name: DB_HOST
      valueFromEnv: PANEL_DB_HOST
    - name: DB_USER
      valueFromEnv: PANEL_DB_USER
    - name: DB_PASS
      valueFromSecret: PANEL_DB_USER_PASSWORD
    - name: DB_NAME
      valueFromEnv: PANEL_DB_NAME
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: requarks/wiki
      tag: 3.3.1
    port: 3000
    volumeMounts: []
