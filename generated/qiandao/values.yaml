configMaps: {}
env:
  AES_PWD: AESPWD
  COOKIE_PWD: CKPWD
  PANEL_APP_PORT_HTTP: 40022
persistence:
  vol-data:
    mountPath: /usr/src/app/config
    size: 10Gi
secrets: {}
services:
  qiandao:
    env:
    - name: PORT
      value: '80'
    - name: AUTO_RELOAD
      value: 'False'
    - name: AES_KEY
      valueFromEnv: AES_PWD
    - name: COOKIE_SIGN_SECRET
      valueFromEnv: COOKIE_PWD
    - name: DB_TYPE
      value: sqlite3
    - name: USER0ISADMIN
      value: 'False'
    - name: GZIP
      value: 'True'
    - name: ACCESS_LOG
      value: 'True'
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: qdtoday/qd:20261108
      tag: null
    port: 80
    volumeMounts:
    - mountPath: /usr/src/app/config
      name: vol-data
