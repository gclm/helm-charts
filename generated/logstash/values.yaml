configMaps: {}
env:
  PANEL_APP_PORT_BEATS: 5044
persistence:
  vol-data:
    mountPath: /usr/share/logstash/data
    size: 10Gi
  vol-pipeline:
    mountPath: /usr/share/logstash/pipeline
    size: 10Gi
secrets: {}
services:
  logstash:
    env:
    - name: PANEL_APP_PORT_BEATS
      valueFromEnv: PANEL_APP_PORT_BEATS
    image:
      registry: ''
      repository: logstash
      tag: 9.5.5
    port: 5044
    volumeMounts:
    - mountPath: /usr/share/logstash/pipeline
      name: vol-pipeline
    - mountPath: /usr/share/logstash/data
      name: vol-data
