configMaps: {}
env:
  PANEL_APP_PORT_HTTP: 18080
persistence:
  vol-data:
    mountPath: /opt/clawswarm
    size: 10Gi
secrets: {}
services:
  clawswarm:
    env:
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: 1panel/clawswarm
      tag: v1.0.5
    port: 18080
    volumeMounts:
    - mountPath: /opt/clawswarm
      name: vol-data
