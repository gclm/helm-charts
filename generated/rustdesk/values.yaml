configMaps: {}
env:
  PANEL_APP_PORT_NAT: 21115
persistence:
  vol-data-hbbs:
    mountPath: /data
    size: 10Gi
secrets: {}
services:
  rustdesk-server:
    env:
    - name: ENCRYPTED_ONLY
      value: '1'
    - name: PANEL_APP_PORT_NAT
      valueFromEnv: PANEL_APP_PORT_NAT
    image:
      registry: ''
      repository: rustdesk/rustdesk-server-s6
      tag: 1.1.16
    port: 21115
    volumeMounts:
    - mountPath: /data
      name: vol-data-hbbs
