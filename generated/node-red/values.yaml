configMaps: {}
env:
  PANEL_APP_PORT_HTTP: '21880'
persistence:
  vol-data:
    mountPath: /data
    size: 10Gi
secrets: {}
services:
  node-red:
    env:
    - name: TZ
      value: Asia/Shanghai
    - name: PANEL_APP_PORT_HTTP
      valueFromEnv: PANEL_APP_PORT_HTTP
    image:
      registry: ''
      repository: nodered/node-red
      tag: 5.0.8
    port: 1880
    volumeMounts:
    - mountPath: /data
      name: vol-data
