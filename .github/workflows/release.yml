name: release-charts

on:
  push:
    branches: [main]
    paths: ['charts/**', 'generated/**', 'overlay/**']
  workflow_dispatch:
  workflow_run:
    workflows: ["sync-appstore"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Discover charts (charts/ + generated/)
        run: |
          CHARTS=$(find charts generated -mindepth 2 -maxdepth 2 -name Chart.yaml 2>/dev/null | xargs -n1 dirname | tr '\n' ' ')
          if [ -z "$CHARTS" ]; then echo "no charts found, nothing to do"; exit 1; fi
          echo "CHARTS=$CHARTS" >> "$GITHUB_ENV"
          echo "discovered: $CHARTS"

      - name: Lint all charts
        run: |
          set -eu
          for c in $CHARTS; do
            echo "== linting ${c}"
            helm lint "${c}" --strict
          done

      - name: Package charts and build index
        run: |
          set -eu
          mkdir -p dist
          helm package $CHARTS -d dist/
          # merge with existing published index to keep version history
          # (raw.githubusercontent.com 不依赖 CF Pages 绑定状态)
          if curl -sfL --retry 2 https://raw.githubusercontent.com/gclm/helm-charts/gh-pages/index.yaml -o old-index.yaml; then
            echo "merging with existing index"
            helm repo index dist --url https://charts.xzim.top --merge old-index.yaml
          else
            echo "no existing index, creating fresh"
            helm repo index dist --url https://charts.xzim.top
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          commit_message: "chore: publish charts ${{ github.sha }}"
