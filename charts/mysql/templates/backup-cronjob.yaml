{{- if .Values.backup.enabled }}
{{- if and .Values.backup.enabled (eq .Values.backup.destination "nfs") (or (not .Values.backup.nfs.server) (not .Values.backup.nfs.path)) }}
{{- fail "backup.destination=nfs requires backup.nfs.server and backup.nfs.path" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mysql.fullname" . }}-backup
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dump
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              env:
                # 已知技术债：MYSQL_PWD 在 8.4 已弃用，加固阶段改 --defaults-extra-file
                - name: MYSQL_PWD
                  valueFrom: {secretKeyRef: {name: {{ include "mysql.fullname" . }}, key: MYSQL_ROOT_PASSWORD}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  D=$(date +%Y%m%d-%H%M%S)
                  OUT="/backup/mysql/$D"
                  mkdir -p "$OUT"
                  echo "[$(date)] dumping to $OUT"
                  for db in $(mysql -h {{ include "mysql.fullname" . }} -uroot -N -B -e \
                      "SHOW DATABASES" | grep -Ev '^(information_schema|performance_schema|mysql|sys)$'); do
                    echo "  -> $db"
                    mysqldump -h {{ include "mysql.fullname" . }} -uroot \
                      --single-transaction --routines --events --triggers \
                      --set-gtid-purged=OFF --databases "$db" > "$OUT/$db.sql"
                  done
                  echo "[$(date)] done:"; ls -lh "$OUT"
                  find /backup/mysql -maxdepth 1 -mindepth 1 -type d -mtime +{{ .Values.backup.retentionDays }} -exec rm -rf {} +
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              {{- if eq .Values.backup.destination "nfs" }}
              nfs:
                server: {{ .Values.backup.nfs.server | quote }}
                path: {{ .Values.backup.nfs.path | quote }}
              {{- else }}
              persistentVolumeClaim: {claimName: {{ include "mysql.fullname" . }}-backup}
              {{- end }}
{{- end }}
