image:
  repository: docker.io/library/mysql
  tag: "8.4"
  pullPolicy: IfNotPresent

auth:
  # 留空则首次安装自动生成并写入 Secret；upgrade 用 lookup 复用，不轮换
  password: ""

persistence:
  storageClass: ""   # "" = 集群默认 StorageClass
  size: 30Gi

# binlog 保留 7 天，为将来 PITR 留能力（⚠️ mysql:8.4 镜像无 mysqlbinlog，PITR 需换镜像）
binlogExpireSeconds: 604800
serverId: 1

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 3Gi

backup:
  enabled: true
  schedule: "40 3 * * *"
  timeZone: "Asia/Shanghai"
  retentionDays: 7
  # 备份落点，三档：
  #   pvc —— 默认。备份写专用 PVC（<release>-backup），零外部依赖，任何集群开箱即用。
  #          注意与 DB 同集群同存储池，防整机损毁能力弱，生产建议 nfs/s3 档。
  #   nfs —— 备份写外部 NFS 共享（如独立备份机），需给 nfs.server/path。
  #   s3  —— 规划中（restic/对象存储，异地容灾档），暂未实现。
  destination: pvc
  pvc:
    storageClass: ""   # "" = 集群默认 StorageClass
    size: 10Gi
  nfs:
    server: ""         # destination=nfs 时必填，如 192.168.10.201
    path: ""           # 如 /hdd-pool/backup/db（导出根，各库写各自子目录）


freshnessAlert:
  enabled: true
  schedule: "10 6 * * *"
  maxAgeHours: 26

mode: standalone
