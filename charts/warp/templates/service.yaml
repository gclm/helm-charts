apiVersion: v1
kind: Service
metadata:
  name: {{ include "warp.fullname" . }}
  labels:
    {{- include "warp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "warp.labels" . | nindent 4 }}
  ports:
    - name: socks
      port: {{ .Values.service.port }}
      targetPort: socks
