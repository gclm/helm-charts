image:
  repository: docker.io/library/redis
  tag: "8-alpine"
  pullPolicy: IfNotPresent

auth:
  # 留空则首次安装自动生成并写入 Secret；upgrade 用 lookup 复用，不轮换
  password: ""

# AOF 开（≤1s 数据安全）+ RDB 开（便于备份）。官方：运行中拷 RDB 安全；AOF 目录不要盲拷
appendonly: true
appendfsync: everysec
save: "900 1"

persistence:
  storageClass: ""   # "" = 集群默认 StorageClass
  size: 8Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

backup:
  enabled: true
  schedule: "50 3 * * *"
  timeZone: "Asia/Shanghai"
  retentionDays: 7
  # 备份落点，三档：
  #   pvc —— 默认。备份写专用 PVC（<release>-backup），零外部依赖，任何集群开箱即用。
  #          注意与 DB 同集群同存储池，防整机损毁能力弱，生产建议 nfs/s3 档。
  #   nfs —— 备份写外部 NFS 共享（如独立备份机），需给 nfs.server/path。
  #   s3  —— 规划中（restic/对象存储，异地容灾档），暂未实现。
  destination: pvc
  pvc:
    storageClass: ""   # "" = 集群默认 StorageClass
    size: 10Gi
  nfs:
    server: ""         # destination=nfs 时必填，如 192.168.10.201
    path: ""           # 如 /hdd-pool/backup/db（导出根，各库写各自子目录）


freshnessAlert:
  enabled: true
  schedule: "10 6 * * *"
  maxAgeHours: 26

mode: standalone
# standalone | cluster（cluster = 主从×2 跨 worker1/master1；sentinel 自动故障转移待后续）
cluster:
  dataMembers: 2
  masterToleration: true
  storageClass: ""   # "" = 沿用 persistence.storageClass

# 备份告警（Q22 教训）：检查最新备份年龄，过期/缺失 → 飞书通知
alerting:
  enabled: true
  schedule: "0 7 * * *"   # 每天 07:00 检查（备份 03:30 跑完）
  maxAgeHours: 26
  image: "docker.io/library/python:3.12-alpine"
  secretName: "backup-alert-feishu"
