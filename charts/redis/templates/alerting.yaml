{{- if and .Values.backup.enabled .Values.alerting.enabled }}
# 备份失败/过期 → 飞书告警（Q22 教训：备份静默死亡不可接受）
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}-alert-script
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  notify.py: |
    import base64, hashlib, hmac, json, os, sys, time, urllib.request
    msg = sys.argv[1]
    ts = str(int(time.time()))
    secret = os.environ["FEISHU_SECRET"]
    key = ("%s\n%s" % (ts, secret)).encode()
    sign = base64.b64encode(hmac.new(key, b"", hashlib.sha256).digest()).decode()
    body = {"timestamp": ts, "sign": sign, "msg_type": "text", "content": {"text": msg}}
    req = urllib.request.Request(os.environ["FEISHU_WEBHOOK"],
                                 data=json.dumps(body).encode(),
                                 headers={"Content-Type": "application/json"})
    print(urllib.request.urlopen(req, timeout=20).read().decode())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "redis.fullname" . }}-backup-alert
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.alerting.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: {{ .Values.alerting.image | quote }}
              env:
                - {name: FEISHU_WEBHOOK, valueFrom: {secretKeyRef: {name: {{ .Values.alerting.secretName }}, key: webhook-url}}}
                - {name: FEISHU_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.alerting.secretName }}, key: sign-secret}}}
                - {name: DB_KIND, value: "Redis"}
                - {name: BACKUP_DIR, value: "/backup/redis"}
                - {name: MAX_AGE_HOURS, value: {{ .Values.alerting.maxAgeHours | quote }}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  LATEST=$(ls -1t "$BACKUP_DIR" 2>/dev/null | head -1)
                  RC=0
                  if [ -z "$LATEST" ]; then
                    MSG="[210 db][$DB_KIND] 备份目录为空！$BACKUP_DIR"; RC=1
                  else
                    AGE=$(( ( $(date +%s) - $(stat -c %Y "$BACKUP_DIR/$LATEST") ) / 3600 ))
                    echo "latest=$LATEST age=${AGE}h max=${MAX_AGE_HOURS}h"
                    if [ "$AGE" -gt "$MAX_AGE_HOURS" ]; then
                      MSG="[210 db][$DB_KIND] 备份已过期 ${AGE}h (>${MAX_AGE_HOURS}h) 最新: $LATEST"; RC=1
                    else
                      echo "OK: backup fresh"; exit 0
                    fi
                  fi
                  echo "$MSG"
                  python3 /scripts/notify.py "$MSG" && echo "alert sent" || echo "alert send FAILED"
                  exit $RC
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: scripts, mountPath: /scripts, readOnly: true}
          volumes:
            - name: backup
              nfs:
                server: {{ .Values.backup.nfs.server | quote }}
                path: {{ .Values.backup.nfs.path | quote }}
            - name: scripts
              configMap:
                name: {{ include "redis.fullname" . }}-alert-script
{{- end }}
