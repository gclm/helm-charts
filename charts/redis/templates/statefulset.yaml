apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis.fullname" . }}
  {{- if eq .Values.mode "cluster" }}
  replicas: {{ .Values.cluster.dataMembers }}
  {{- else }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "redis.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redis.labels" . | nindent 8 }}
    spec:
      {{- if eq .Values.mode "cluster" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "redis.labels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- if .Values.cluster.masterToleration }}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      {{- end }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- if eq .Values.mode "cluster" }}
              # 运行时判断：pod 序号非 0 的是从库（replicaof 指向 pod-0）
              ORD=$(hostname | sed 's/.*-//')
              EXTRA=""
              [ "$ORD" != "0" ] && EXTRA="--masterauth $REDIS_PASSWORD --replicaof {{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local 6379"
              exec redis-server \
                --requirepass "$REDIS_PASSWORD" \
                --appendonly {{ if .Values.appendonly }}yes{{ else }}no{{ end }} \
                --appendfsync {{ .Values.appendfsync }} \
                --dir /data \
                --save "{{ .Values.save }}" $EXTRA
              {{- else }}
              exec redis-server \
                --requirepass "$REDIS_PASSWORD" \
                --appendonly {{ if .Values.appendonly }}yes{{ else }}no{{ end }} \
                --appendfsync {{ .Values.appendfsync }} \
                --dir /data \
                --save "{{ .Values.save }}"
              {{- end }}
                --appendonly {{ if .Values.appendonly }}yes{{ else }}no{{ end }} \
                --appendfsync {{ .Values.appendfsync }} \
                --dir /data \
                --save "{{ .Values.save }}"
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "redis.fullname" . }}, key: REDIS_PASSWORD}}
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if ne .Values.mode "cluster" }}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "redis.fullname" . }}-data}
        {{- end }}
  {{- if eq .Values.mode "cluster" }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.cluster.storageClass | default .Values.persistence.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
