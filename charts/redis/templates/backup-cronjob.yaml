{{- if .Values.backup.enabled }}
{{- if and .Values.backup.enabled (eq .Values.backup.destination "nfs") (or (not .Values.backup.nfs.server) (not .Values.backup.nfs.path)) }}
{{- fail "backup.destination=nfs requires backup.nfs.server and backup.nfs.path" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }}-backup
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dump
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              env:
                - name: REDIS_PASSWORD
                  valueFrom: {secretKeyRef: {name: {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }}, key: REDIS_PASSWORD}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  D=$(date +%Y%m%d-%H%M%S)
                  OUT="/backup/redis/$D"
                  mkdir -p "$OUT"
                  echo "[$(date)] BGSAVE on redis"
                  redis-cli -h {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }} -a "$REDIS_PASSWORD" --no-auth-warning BGSAVE
                  for i in $(seq 1 60); do
                    st=$(redis-cli -h {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }} -a "$REDIS_PASSWORD" --no-auth-warning \
                         INFO persistence | tr -d '\r' | awk -F: '/rdb_bgsave_in_progress/{print $2}')
                    [ "$st" = "0" ] && break
                    echo "  waiting bgsave... ($i)"; sleep 2
                  done
                  echo "[$(date)] pulling RDB to $OUT"
                  redis-cli -h {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }} -a "$REDIS_PASSWORD" --no-auth-warning --rdb "$OUT/dump.rdb"
                  echo "[$(date)] verifying RDB"
                  redis-check-rdb "$OUT/dump.rdb"
                  redis-cli -h {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }} -a "$REDIS_PASSWORD" --no-auth-warning INFO server > "$OUT/info-server.txt"
                  redis-cli -h {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }} -a "$REDIS_PASSWORD" --no-auth-warning DBSIZE     > "$OUT/dbsize.txt"
                  echo "[$(date)] done:"; ls -lh "$OUT"
                  find /backup/redis -maxdepth 1 -mindepth 1 -type d -mtime +{{ .Values.backup.retentionDays }} -exec rm -rf {} +
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              {{- if eq .Values.backup.destination "nfs" }}
              nfs:
                server: {{ .Values.backup.nfs.server | quote }}
                path: {{ .Values.backup.nfs.path | quote }}
              {{- else }}
              persistentVolumeClaim: {claimName: {{ if eq .Values.mode "cluster" }}{{ include "redis.fullname" . }}-0.{{ include "redis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "redis.fullname" . }}{{ end }}-backup}
              {{- end }}
{{- end }}
