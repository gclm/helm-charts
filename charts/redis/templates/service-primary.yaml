{{- if eq .Values.mode "cluster" }}
# 写入口：只选 ordinal 0（当前 master）。
# 为什么需要它：redis 没有 libpq 的 target_session_attrs，客户端无法自动挑主。
# ClusterIP Service 会把写请求轮询到只读副本（实测 20 次写 9 次 READONLY）。
# ⚠️ promote 之后 master 会变成 redis-1，此时需按 runbook 手动把 selector 改成 redis-1。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}-primary
  labels:
    {{- include "redis.labels" . | nindent 4 }}
    role: primary
spec:
  type: ClusterIP
  selector:
    {{- include "redis.labels" . | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "redis.fullname" . }}-0
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
