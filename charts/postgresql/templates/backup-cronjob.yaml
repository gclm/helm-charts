{{- if .Values.backup.enabled }}
{{- if and .Values.backup.enabled (eq .Values.backup.destination "nfs") (or (not .Values.backup.nfs.server) (not .Values.backup.nfs.path)) }}
{{- fail "backup.destination=nfs requires backup.nfs.server and backup.nfs.path" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgresql.fullname" . }}-backup
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dump
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ include "postgresql.fullname" . }}, key: POSTGRES_PASSWORD}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # cluster: DSN 带全成员 + target_session_attrs，客户端自己挑主库
                  # （不硬编码 -0：promote 后 -0 可能是只读副本，会静默备份旧数据）
                  if [ "{{ .Values.mode }}" = "cluster" ]; then
                    HOST="{{ include "postgresql.memberHosts" . }}"
                    DSN="host=$HOST port=5432 user=postgres target_session_attrs=read-write"
                    # 断言确实连到可写主库
                    INREC=$(psql -d "$DSN" -tAc "SELECT pg_is_in_recovery()")
                    if [ "$INREC" != "f" ]; then
                      echo "FATAL: not connected to a writable primary (pg_is_in_recovery=$INREC)"; exit 1
                    fi
                    echo "[backup] connected to primary; members=$HOST"
                  else
                    DSN="host={{ include "postgresql.fullname" . }} port=5432 user=postgres"
                  fi
                  D=$(date +%Y%m%d-%H%M%S)
                  OUT="/backup/postgresql/$D"
                  mkdir -p "$OUT"
                  echo "[$(date)] dumping all databases to $OUT"
                  for db in $(psql -d "$DSN" -tAc \
                      "SELECT datname FROM pg_database WHERE datistemplate = false AND datname <> 'postgres'"); do
                    echo "  -> $db"
                    pg_dump -d "$DSN dbname=$db" -Fc -f "$OUT/$db.dump"
                  done
                  pg_dumpall -d "$DSN" --globals-only --no-role-passwords -f "$OUT/globals.sql"
                  # 断言：至少产出 1 个 dump，否则视为失败（防假绿）
                  N=$(ls "$OUT"/*.dump 2>/dev/null | wc -l)
                  if [ "$N" -eq 0 ]; then echo "FATAL: no dump produced (no user databases?)"; exit 1; fi
                  echo "[$(date)] done: $N dumps"
                  ls -lh "$OUT"
                  find /backup/postgresql -maxdepth 1 -mindepth 1 -type d -mtime +{{ .Values.backup.retentionDays }} -exec rm -rf {} +
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              {{- if eq .Values.backup.destination "nfs" }}
              nfs:
                server: {{ .Values.backup.nfs.server | quote }}
                path: {{ .Values.backup.nfs.path | quote }}
              {{- else }}
              persistentVolumeClaim: {claimName: {{ include "postgresql.fullname" . }}-backup}
              {{- end }}
{{- end }}
