{{- if .Values.backup.enabled }}
{{- if and .Values.backup.enabled (eq .Values.backup.destination "nfs") (or (not .Values.backup.nfs.server) (not .Values.backup.nfs.path)) }}
{{- fail "backup.destination=nfs requires backup.nfs.server and backup.nfs.path" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgresql.fullname" . }}-backup
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dump
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ include "postgresql.fullname" . }}, key: POSTGRES_PASSWORD}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  D=$(date +%Y%m%d-%H%M%S)
                  OUT="/backup/postgresql/$D"
                  mkdir -p "$OUT"
                  echo "[$(date)] dumping all databases to $OUT"
                  for db in $(psql -h {{ if eq .Values.mode "cluster" }}{{ include "postgresql.fullname" . }}-0.{{ include "postgresql.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "postgresql.fullname" . }}{{ end }} -U postgres -tAc \
                      "SELECT datname FROM pg_database WHERE datistemplate = false AND datname <> 'postgres'"); do
                    echo "  -> $db"
                    pg_dump -h {{ if eq .Values.mode "cluster" }}{{ include "postgresql.fullname" . }}-0.{{ include "postgresql.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "postgresql.fullname" . }}{{ end }} -U postgres -Fc -d "$db" -f "$OUT/$db.dump"
                  done
                  pg_dumpall -h {{ if eq .Values.mode "cluster" }}{{ include "postgresql.fullname" . }}-0.{{ include "postgresql.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local{{ else }}{{ include "postgresql.fullname" . }}{{ end }} -U postgres --globals-only -f "$OUT/globals.sql"
                  echo "[$(date)] done:"
                  ls -lh "$OUT"
                  find /backup/postgresql -maxdepth 1 -mindepth 1 -type d -mtime +{{ .Values.backup.retentionDays }} -exec rm -rf {} +
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              {{- if eq .Values.backup.destination "nfs" }}
              nfs:
                server: {{ .Values.backup.nfs.server | quote }}
                path: {{ .Values.backup.nfs.path | quote }}
              {{- else }}
              persistentVolumeClaim: {claimName: {{ include "postgresql.fullname" . }}-backup}
              {{- end }}
{{- end }}
