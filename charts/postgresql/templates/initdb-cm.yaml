{{- if eq .Values.mode "cluster" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-initdb
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  # 只在 primary 首次 initdb 时执行（副本是 pg_basebackup 拷贝，不会跑这个）
  00-replication.sh: |
    #!/bin/bash
    set -e
    echo "[initdb] creating replication user {{ .Values.cluster.replicationUser }}"
    # 幂等：已存在则改口令（支持轮换），不存在则创建。口令独立于超管。
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
      DO \$\$
      BEGIN
        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ .Values.cluster.replicationUser }}') THEN
          ALTER USER {{ .Values.cluster.replicationUser }} WITH REPLICATION LOGIN PASSWORD '${REPLICATION_PASSWORD}';
        ELSE
          CREATE USER {{ .Values.cluster.replicationUser }} WITH REPLICATION LOGIN PASSWORD '${REPLICATION_PASSWORD}';
        END IF;
      END
      \$\$;
    EOSQL
    # 允许集群内网段复制连接
    grep -q "^host replication {{ .Values.cluster.replicationUser }}" "$PGDATA/pg_hba.conf" 2>/dev/null || {
      echo "host replication {{ .Values.cluster.replicationUser }} 0.0.0.0/0 scram-sha-256" >> "$PGDATA/pg_hba.conf"
      echo "host replication {{ .Values.cluster.replicationUser }} ::/0 scram-sha-256" >> "$PGDATA/pg_hba.conf"
    }
    echo "[initdb] replication user ready"
{{- end }}
