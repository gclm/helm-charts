apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "postgresql.password" . | quote }}
{{- if eq .Values.mode "cluster" }}
  REPLICATION_PASSWORD: {{ include "postgresql.replicationPassword" . | quote }}
{{- end }}
