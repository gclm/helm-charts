apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: {{ include "mongodb.password" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}-keyfile
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  keyfile: {{ include "mongodb.keyfile" . | quote }}
