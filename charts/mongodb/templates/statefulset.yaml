apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mongodb.fullname" . }}
  {{- if eq .Values.mode "cluster" }}
  replicas: {{ .Values.cluster.dataMembers }}
  {{- else }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "mongodb.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mongodb.labels" . | nindent 8 }}
    spec:
      {{- if eq .Values.mode "cluster" }}
      # required 反亲和：数据成员强制跨节点；节点不足则 Pending（拒绝假 HA）
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "mongodb.labels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- if .Values.cluster.masterToleration }}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      {{- end }}
      {{- end }}
      # mongo 镜像以 uid 999 运行，读不了 Secret 挂载的 root 属主文件
      # → init 以 root 拷到 emptyDir 并 chown 999 / chmod 400（不动主容器 entrypoint，保留 INITDB）
      initContainers:
        - name: init-keyfile
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - cp /etc/mongo-key/keyfile /keyfiles/keyfile && chmod 400 /keyfiles/keyfile && chown 999:999 /keyfiles/keyfile
          volumeMounts:
            - {name: mongo-key, mountPath: /etc/mongo-key, readOnly: true}
            - {name: keyfiles, mountPath: /keyfiles}
      containers:
        - name: mongo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --replSet
            - {{ .Values.replicaSetName | quote }}
            - --bind_ip_all
            - --keyFile
            - /keyfiles/keyfile
          ports:
            - {name: mongo, containerPort: 27017}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.auth.username | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "mongodb.fullname" . }}, key: MONGO_ROOT_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: keyfiles, mountPath: /keyfiles, readOnly: true}
          readinessProbe:
            # ⚠️ 必须显式 timeoutSeconds：mongosh 冷启动 1-3s，默认 1s 必超时 → rollout 卡死
            exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if eq .Values.mode "cluster" }}
      # cluster：每成员独立卷（volumeClaimTemplates），standalone 沿用单 PVC
      {{- else }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ include "mongodb.fullname" . }}-data}
      {{- end }}
        - name: mongo-key
          secret: {secretName: {{ include "mongodb.fullname" . }}-keyfile}
        - name: keyfiles
          emptyDir: {}
  {{- if eq .Values.mode "cluster" }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (.Values.cluster.storageClass | default .Values.persistence.storageClass) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
