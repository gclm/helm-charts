{{- if and .Values.backup.enabled .Values.freshnessAlert.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mongodb.fullname" . }}-backup-fresh
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
  annotations:
    # Job 失败 = 备份过期（Q22 教训：备份静默死亡不可接受）。后续可接 webhook 通知。
    description: "fails when the latest mongodb backup on NFS is older than maxAgeHours"
spec:
  schedule: {{ .Values.freshnessAlert.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  BASE=/backup/mongodb
                  LATEST=$(ls -1t "$BASE" 2>/dev/null | head -1)
                  [ -n "$LATEST" ] || { echo "FATAL: no backup dir under $BASE"; exit 1; }
                  AGE=$(( ( $(date +%s) - $(stat -c %Y "$BASE/$LATEST") ) / 3600 ))
                  echo "latest=$LATEST age=${AGE}h (max {{ .Values.freshnessAlert.maxAgeHours }}h)"
                  [ "$AGE" -le {{ .Values.freshnessAlert.maxAgeHours }} ] || { echo "FATAL: mongodb backup is stale"; exit 1; }
                  echo "OK: backup fresh"
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              nfs:
                server: {{ .Values.backup.nfs.server | quote }}
                path: {{ .Values.backup.nfs.path | quote }}
{{- end }}
