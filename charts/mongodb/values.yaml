# 资源名前缀；留空则用 release 名（截断 38，见 _helpers.tpl）
fullnameOverride: ""

image:
  repository: docker.io/library/mongo
  tag: "8.0"
  pullPolicy: IfNotPresent

auth:
  username: root
  # 留空则首次安装自动生成并写入 Secret；upgrade 用 lookup 复用，不轮换
  password: ""

# 副本集名。⚠️ mongodump --oplog 必须副本集；auth + replSet 必须 keyFile（chart 已内置）
replicaSetName: rs0

persistence:
  storageClass: ""   # "" = 集群默认 StorageClass
  size: 30Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 3Gi

backup:
  enabled: true
  schedule: "20 4 * * *"
  timeZone: "Asia/Shanghai"
  retentionDays: 7
  # 备份落点，三档：
  #   pvc —— 默认。备份写专用 PVC（<release>-backup），零外部依赖，任何集群开箱即用。
  #          注意与 DB 同集群同存储池，防整机损毁能力弱，生产建议 nfs/s3 档。
  #   nfs —— 备份写外部 NFS 共享（如独立备份机），需给 nfs.server/path。
  #   s3  —— 规划中（restic/对象存储，异地容灾档），暂未实现。
  destination: pvc
  pvc:
    storageClass: ""   # "" = 集群默认 StorageClass
    size: 10Gi
  nfs:
    server: ""         # destination=nfs 时必填，如 192.168.10.201
    path: ""           # 如 /hdd-pool/backup/db（导出根，各库写各自子目录）


freshnessAlert:
  enabled: true
  schedule: "10 6 * * *"
  maxAgeHours: 26

# standalone | cluster（cluster = 数据成员×2 跨 worker1/master1 + srs 仲裁者）
mode: standalone
cluster:
  dataMembers: 2
  # 数据成员 toleration：允许上 master1（control-plane 污点保留，定向容忍）
  masterToleration: true
  arbiter:
    enabled: true
    nodeSelector: {kubernetes.io/hostname: srs}
    tolerations:
      - {key: dedicated, operator: Equal, value: infra-only, effect: NoSchedule}
  storageClass: ""   # "" = 沿用 persistence.storageClass
